<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Inter é self-hosted via @fontsource (imports em src/app.css).
		     Isso elimina o round-trip para fonts.googleapis.com/fonts.gstatic.com,
		     permite cache no edge da Cloudflare e simplifica a CSP. -->
		<script src="/init.js"></script>
		%sveltekit.head%
	</head>
	<!-- `selection:` precisa dos DOIS modos (VIS-2): o realce é primary-500/30,
	     que compõe claro sobre fundo claro e escuro sobre fundo escuro. Um texto
	     de seleção só-claro (primary-100) dava 1,22:1 no modo claro — o texto
	     selecionado sumia. -->
	<body
		data-theme="policial"
		class="bg-white dark:bg-surface-950 text-surface-950 dark:text-surface-50 antialiased selection:bg-primary-500/30 selection:text-surface-950 dark:selection:text-primary-100"
		data-sveltekit-preload-data="hover"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
