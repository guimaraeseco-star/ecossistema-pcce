name: Atualiza trust store ICP-Brasil

# Roda mensalmente (todo dia 1 às 06:00 UTC ≈ 03:00 Brasília) e também
# pode ser disparado manualmente via "Run workflow" na aba Actions.
#
# Se a cadeia oficial da ITI mudar (raízes ou intermediárias), abre um PR
# com o diff dos PEMs para revisão e merge manual. Se nada mudou, sai
# silencioso.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar dependências do script
        run: sudo apt-get update && sudo apt-get install -y curl openssl unzip

      - name: Rodar update-trust-store.sh
        working-directory: src/lib/server/assinatura/icp-brasil
        run: ./update-trust-store.sh

      - name: Verificar se houve mudança
        id: diff
        # update-trust-store.sh grava "# Atualizado em <timestamp da execução>"
        # no topo dos dois arquivos TODA vez que roda — mesmo quando nenhum
        # certificado mudou. Um `git diff` cru nunca fica vazio por causa
        # dessa linha, então o job abriria PR TODO mês independente da ITI
        # ter mudado algo, contradizendo o "sai silencioso" do cabeçalho
        # deste workflow. Compara ignorando só essa linha — o resto do
        # arquivo (certificados, Subject, Validade, SHA-256) decide de
        # verdade se houve mudança.
        run: |
          normalizar() { sed 's/^# Atualizado em .*/# Atualizado em <normalizado>/'; }
          mudou=false
          for f in src/lib/server/assinatura/icp-brasil/roots.pem src/lib/server/assinatura/icp-brasil/intermediates.pem; do
            if ! diff -q <(git show "HEAD:$f" | normalizar) <(normalizar < "$f") >/dev/null; then
              mudou=true
            fi
          done
          if [ "$mudou" = false ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cadeia ICP-Brasil sem alterações — nada a fazer."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Mudanças detectadas — abrindo PR."
            git diff --stat src/lib/server/assinatura/icp-brasil/roots.pem src/lib/server/assinatura/icp-brasil/intermediates.pem
          fi

      - name: Abrir PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: |
            chore(icp-brasil): atualiza trust store

            Atualização automática gerada pelo workflow
            update-icp-brasil-trust-store.yml a partir das fontes oficiais
            da ITI (acraiz.icpbrasil.gov.br).
          title: 'chore(icp-brasil): atualiza trust store'
          body: |
            Atualização automática da cadeia ICP-Brasil (raízes + intermediárias).

            **Origem:** `https://acraiz.icpbrasil.gov.br/credenciadas/`
            **Disparado por:** workflow `update-icp-brasil-trust-store.yml` (cron mensal)

            ### Como revisar

            1. Confira o diff dos arquivos `roots.pem` e `intermediates.pem`.
            2. Os comentários acima de cada certificado mostram **Subject**,
               **Validade** e **SHA-256** — verifique se há ACs novas
               credenciadas pela ITI ou ACs descredenciadas (removidas).
            3. Se quiser conferir contra a fonte oficial, compare o SHA-256
               com o publicado pela ITI em
               <https://www.gov.br/iti/pt-br/assuntos/repositorio>.

            Após merge, o `loadTrustStore()` em runtime passa a reconhecer
            as ACs novas/atualizadas automaticamente — nenhum redeploy
            adicional é necessário além do já feito por `deploy.yml`.
          branch: chore/icp-brasil-trust-store-update
          delete-branch: true
          labels: |
            chore
            icp-brasil

      # Notifica os responsaveis por e-mail. Sem isso, o PR pode ficar
      # parado na aba "Pull Requests" sem ninguem perceber por dias —
      # a ITI eventualmente publica nova versao da cadeia (com cert novo
      # que so vai validar APOS o merge), entao precisamos de canal ativo.
      #
      # Requer 3 secrets configurados em Settings → Secrets and variables →
      # Actions do repositorio:
      #   GMAIL_USER             — conta SMTP (mesma usada pelo worker)
      #   GMAIL_APP_PASSWORD     — App Password do Gmail (NAO a senha)
      #   ICP_TRUST_NOTIFY_TO    — destinatario(s); separe multiplos com virgula
      #
      # A notificacao vem LIGADA e se desliga pela variavel de repositorio
      # `NOTIFY=false` (Settings → Secrets and variables → Actions → Variables).
      #
      # O `if` precisa ser `vars`, e nao `secrets`: o contexto `secrets` NAO
      # esta disponivel em condicao de step, entao nao da para pular o passo
      # "quando os secrets faltarem" — que era o que o comentario antigo
      # descrevia e o `if` nao fazia. Sem os secrets, o step FALHA e o
      # `continue-on-error` segura o workflow; o X vermelho no passo e o sinal
      # de que a notificacao esta configurada pela metade.
      - name: Notificar por e-mail
        if: >-
          vars.NOTIFY != 'false' && steps.diff.outputs.changed == 'true' &&
          steps.pr.outputs.pull-request-url != ''
        uses: dawidd6/action-send-mail@v20
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: 'Escalas PC-CE (CI) <${{ secrets.GMAIL_USER }}>'
          to: ${{ secrets.ICP_TRUST_NOTIFY_TO }}
          subject: '[Escalas] Trust store ICP-Brasil atualizado — PR aguardando revisão'
          html_body: |
            <h2>Cadeia ICP-Brasil mudou</h2>
            <p>O workflow mensal detectou alteração na cadeia oficial da ITI
            (raízes ou ACs intermediárias) e abriu um PR automático para
            atualizar o trust store do sistema de assinaturas digitais.</p>

            <p><strong>Operação:</strong> ${{ steps.pr.outputs.pull-request-operation }}<br>
            <strong>PR:</strong> <a href="${{ steps.pr.outputs.pull-request-url }}">
            #${{ steps.pr.outputs.pull-request-number }}</a></p>

            <h3>O que fazer</h3>
            <ol>
              <li>Abra o PR no link acima.</li>
              <li>Confira o diff dos PEMs — os comentários antes de cada
              cert mostram Subject, Validade e SHA-256.</li>
              <li>Compare opcionalmente com o publicado em
              <a href="https://www.gov.br/iti/pt-br/assuntos/repositorio">
              gov.br/iti/repositorio</a>.</li>
              <li>Aprove e dê merge em <code>main</code>.</li>
            </ol>

            <p>Após merge, o sistema reconhece as ACs novas automaticamente —
            nenhum redeploy manual necessário.</p>

            <hr>
            <p style="color:#666;font-size:0.85em">
            Mensagem automática gerada pelo workflow
            <code>update-icp-brasil-trust-store.yml</code>.<br>
            Para parar de receber, remova
            <code>ICP_TRUST_NOTIFY_TO</code> dos secrets do repositório.</p>
